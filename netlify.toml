[build]
  publish = "dist"
  command = "npm run build"
[build.environment]
  FORM_MODE = "netlify"
  SITE_URL = "https://handyhab.com"
[build.processing.html]
  pretty_urls = false
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[redirects]]
  from = "https://handhab.netlify.app/*"
  to = "https://handyhab.com/:splat"
  status = 301
  force = true
